<!doctype html>
<html>
<body>
<script>
// 裁掉灰边（内侧收紧）+ B站式圆角蒙版（四角透明）+ 超采缩放
window.processIcon = async function () {
  const img = new Image()
  await new Promise((res, rej) => {
    img.onload = res
    img.onerror = rej
    img.src = 'source.jpg'
  })

  // 1) 定位黑色主体包围盒（阈值更严：只算纯黑区，且向内收 3px 消灰晕）
  const scan = document.createElement('canvas')
  scan.width = img.width
  scan.height = img.height
  const sctx = scan.getContext('2d')
  sctx.drawImage(img, 0, 0)
  const data = sctx.getImageData(0, 0, img.width, img.height).data
  let minX = img.width, minY = img.height, maxX = -1, maxY = -1
  for (let y = 0; y < img.height; y++) {
    for (let x = 0; x < img.width; x++) {
      const i = (y * img.width + x) * 4
      const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]
      if (lum < 90) {
        if (x < minX) minX = x
        if (x > maxX) maxX = x
        if (y < minY) minY = y
        if (y > maxY) maxY = y
      }
    }
  }
  if (maxX < 0) { minX = 0; minY = 0; maxX = img.width - 1; maxY = img.height - 1 }
  minX += 3; minY += 3; maxX -= 3; maxY -= 3
  const side = Math.max(maxX - minX + 1, maxY - minY + 1)
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2
  const sx = Math.max(0, cx - side / 2)
  const sy = Math.max(0, cy - side / 2)

  const out = { crop: { x: Math.round(sx), y: Math.round(sy), side } }
  for (const size of [16, 32, 48, 64, 128, 256, 512, 1024]) {
    const ss = size * 2
    const big = document.createElement('canvas')
    big.width = big.height = ss
    const bctx = big.getContext('2d')
    bctx.imageSmoothingEnabled = true
    bctx.imageSmoothingQuality = 'high'
    bctx.drawImage(img, sx, sy, side, side, 0, 0, ss, ss)
    // B站式圆角蒙版：圆角半径约 22%（四角透明）
    const r = ss * 0.22
    bctx.globalCompositeOperation = 'destination-in'
    bctx.beginPath()
    bctx.moveTo(r, 0)
    bctx.arcTo(ss, 0, ss, ss, r)
    bctx.arcTo(ss, ss, 0, ss, r)
    bctx.arcTo(0, ss, 0, 0, r)
    bctx.arcTo(0, 0, ss, 0, r)
    bctx.closePath()
    bctx.fill()
    bctx.globalCompositeOperation = 'source-over'
    // 降采样
    const fin = document.createElement('canvas')
    fin.width = fin.height = size
    const fctx = fin.getContext('2d')
    fctx.imageSmoothingEnabled = true
    fctx.imageSmoothingQuality = 'high'
    fctx.drawImage(big, 0, 0, ss, ss, 0, 0, size, size)
    out[size] = fin.toDataURL('image/png')
  }
  return out
}
</script>
</body>
</html>
