<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 黑色背景：极轻微的高光层次 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131316"/>
      <stop offset="0.55" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <!-- 白色主体：斜向金属光泽 -->
    <linearGradient id="metal" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#f4f4f6"/>
      <stop offset="0.58" stop-color="#d9d9de"/>
      <stop offset="0.78" stop-color="#f6f6f8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <!-- 倒影渐隐 -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflMask">
      <rect x="0" y="404" width="512" height="108" fill="url(#fade)"/>
    </mask>
  </defs>

  <!-- 圆角黑底（四角透明） -->
  <rect x="0" y="0" width="512" height="512" rx="113" fill="url(#bg)"/>

  <!-- J 形主体：圆头描边 -->
  <g fill="none" stroke="url(#metal)" stroke-width="86" stroke-linecap="round">
    <path d="M 317 46 L 317 300 A 63.5 63.5 0 0 1 190 300 L 190 184"/>
  </g>

  <!-- 镜面线 -->
  <rect x="188" y="402" width="136" height="9" rx="4.5" fill="#ffffff" opacity="0.92"/>

  <!-- 倒影：主体垂直镜像，向下渐隐 -->
  <g mask="url(#reflMask)" opacity="0.8">
    <g transform="translate(0 813) scale(1 -1)" fill="none" stroke="url(#metal)" stroke-width="86" stroke-linecap="round">
      <path d="M 317 46 L 317 300 A 63.5 63.5 0 0 1 190 300 L 190 184"/>
    </g>
  </g>
</svg>
